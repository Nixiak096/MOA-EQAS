worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # 前端静态资源与 API 同源（都由 agent-app 提供），无需额外 CORS 处理
    upstream agent_app {
        server agent-app:5000;
    }

    server {
        listen 80;
        server_name _;

        # 上传文档体量上限（与 agent-app 的 MAX_UPLOAD_SIZE 保持一致）
        client_max_body_size 50M;

        # SSE：必须关闭缓冲，否则四智能体的流式过程会被攒成一整包后才下发
        location /chat/stream {
            proxy_pass http://agent_app/chat/stream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;   # 大模型阶段可能静默数十秒
            chunked_transfer_encoding on;
        }

        # 其余全部转给应用（含 /、/health、/api、/knowledge/*、/indicators 等）
        location / {
            proxy_pass http://agent_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }
    }
}
